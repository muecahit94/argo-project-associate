apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: python-app-
  namespace: argo
spec:
    serviceAccountName: argo-workflow
    entrypoint: python-app
    templates:
      - name: python-app
        steps:
          - - name: build
              template: build
          - - name: test
              template: test
          # - - name: build-and-push
          #     template: build-and-push
          - - name: deploy
              template: deploy
      - name: build
        container:
          image: python:3.11
          command: [python]
          args: ["-c", "print('build')"]
      - name: test
        container:
          image: python:3.11
          command: [python]
          args: ["-m", "unittest"]
          volumeMounts:
            - name: test-volume
              mountPath: /app/tests
        volumes:
          - name: test-volume
            hostPath:
              path: /path/to/tests
